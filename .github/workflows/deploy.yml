name: Deploy na Northflank

on:
  push:
    branches:
      - claude/todo-implementation-o9w30h
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Dohvati zadnji commit SHA
        id: sha
        run: echo "sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      - name: Trigeriraj build na Northflanku
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.NORTHFLANK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"sha\": \"${{ steps.sha.outputs.sha }}\"}" \
            "https://api.northflank.com/v1/projects/agency-v3/services/swarm/build")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          echo "$BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Build nije pokrenut (HTTP $HTTP_CODE)"
            exit 1
          fi

          BUILD_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['id'])")
          echo "✅ Build pokrenut: $BUILD_ID"
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Čekaj da build završi
        id: wait
        run: |
          BUILD_ID="${{ steps.deploy.outputs.build_id }}"
          for i in $(seq 1 20); do
            sleep 15
            STATUS=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.NORTHFLANK_TOKEN }}" \
              "https://api.northflank.com/v1/projects/agency-v3/services/swarm/build/$BUILD_ID" \
              | python3 -c "import sys,json; d=json.load(sys.stdin)['data']; print(d.get('status','?'), d.get('concluded',False))")
            echo "[$i/20] $STATUS"
            if echo "$STATUS" | grep -q "True"; then
              if echo "$STATUS" | grep -q "SUCCESS"; then
                echo "✅ Build uspješan"
                exit 0
              else
                echo "❌ Build neuspješan"
                exit 1
              fi
            fi
          done
          echo "⏱️ Timeout — build još traje"
