  en: "BTC Turtle Breakout (ATR Risk)"
  zh: "BTC海龟突破策略（ATR风控）"
  zh-tw: "BTC海龜突破策略（ATR風控）"
  es: "Ruptura estilo Turtle BTC (riesgo ATR)"
  ja: "BTCタートル・ブレイクアウト（ATRリスク管理）"
