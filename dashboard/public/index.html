<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Swarm</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#07070f;color:#c9d1d9;font-family:'Courier New',monospace;min-height:100vh}

  .header{
    padding:18px 28px;
    border-bottom:1px solid #161b22;
    display:flex;justify-content:space-between;align-items:center;
    position:sticky;top:0;background:#07070f;z-index:10;
  }
  .header h1{font-size:1.1rem;color:#7c3aed;letter-spacing:2px}
  .total-label{font-size:.65rem;color:#484f58;text-align:right;margin-bottom:2px}
  .total{font-size:2rem;color:#22c55e;font-weight:bold;font-variant-numeric:tabular-nums}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:14px;padding:22px 28px;
  }
  .card{
    background:#0d1117;border:1px solid #161b22;border-radius:10px;
    padding:18px;transition:border-color .2s;
  }
  .card:hover{border-color:#7c3aed44}
  .card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .dot{width:7px;height:7px;background:#22c55e;border-radius:50%;animation:pulse 2s infinite;flex-shrink:0}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .card-name{font-size:.95rem;font-weight:bold;color:#7c3aed}
  .card-desc{font-size:.7rem;color:#484f58;margin-bottom:14px}
  .card-amount{font-size:1.5rem;color:#22c55e;font-variant-numeric:tabular-nums}
  .card-meta{font-size:.68rem;color:#484f58;margin-top:5px}

  .section-title{
    padding:0 28px 10px;font-size:.7rem;color:#484f58;
    letter-spacing:2px;text-transform:uppercase;
  }

  .log-wrap{margin:0 28px 80px;background:#0d1117;border:1px solid #161b22;border-radius:10px;overflow:hidden}
  .log-head{
    padding:10px 16px;background:#0a0e17;font-size:.7rem;color:#484f58;
    border-bottom:1px solid #161b22;display:flex;align-items:center;gap:8px;
  }
  .log-body{max-height:360px;overflow-y:auto}
  .log-row{
    display:grid;grid-template-columns:130px 110px 1fr 90px;
    gap:10px;padding:9px 16px;border-bottom:1px solid #0d1117;font-size:.72rem;
    transition:background .15s;
  }
  .log-row:hover{background:#161b22}
  .lt{color:#3d444d}
  .la{color:#7c3aed}
  .lc{color:#c9d1d9}
  .lm{color:#22c55e;text-align:right;font-weight:bold}

  .statusbar{
    position:fixed;bottom:0;left:0;right:0;
    padding:7px 28px;background:#0a0e17;border-top:1px solid #161b22;
    font-size:.65rem;color:#3d444d;display:flex;justify-content:space-between;
  }
  .empty{padding:30px;text-align:center;color:#3d444d;font-size:.8rem}
</style>
</head>
<body>

<div class="header">
  <h1>⚡ AGENT SWARM</h1>
  <div>
    <div class="total-label">UKUPNO ZARAĐENO</div>
    <div class="total" id="total">$0.00</div>
  </div>
</div>

<div class="grid" id="cards"></div>

<div class="section-title">Live log</div>
<div class="log-wrap">
  <div class="log-head"><span class="dot"></span>Poslednje akcije — osvežava svakih 30s</div>
  <div class="log-body" id="log"></div>
</div>

<div class="statusbar">
  <span><span class="dot" style="display:inline-block;margin-right:5px"></span>LIVE</span>
  <span id="updated">—</span>
</div>

<script>
const DESC = {
  'Zero':         'Bug bounty scanner',
  'Nova':         'Airdrop hunter',
  'Newton-Tesla': 'Flash loan arb',
  'Zora':         'Free NFT mint',
  'Satoshi':      'Cross-chain arb',
  'Turing':       'Galxe / QuestN',
  'Planck-Bohr':  'MEV extraction',
  'Chronos':      'Temporal arb',
  'Euler':        'Yield farming',
  'Mendeleev':    'Token composition'
};

function fmt(n){
  return '$'+parseFloat(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function timeAgo(d){
  const s=Math.floor((Date.now()-new Date(d))/1000);
  if(s<60)return s+'s ago';
  if(s<3600)return Math.floor(s/60)+'m ago';
  return Math.floor(s/3600)+'h ago';
}

async function refresh(){
  const [summary,results]=await Promise.all([
    fetch('/api/summary').then(r=>r.json()).catch(()=>[]),
    fetch('/api/results').then(r=>r.json()).catch(()=>[])
  ]);

  const cardsEl=document.getElementById('cards');
  if(!summary.length){
    cardsEl.innerHTML='<div class="empty">Nema podataka još — agenti se pokreću...</div>';
  } else {
    cardsEl.innerHTML=summary.map(a=>`
      <div class="card">
        <div class="card-top"><span class="dot"></span><span class="card-name">${a.agent_name}</span></div>
        <div class="card-desc">${DESC[a.agent_name]||''}</div>
        <div class="card-amount">${fmt(a.total_amount)}</div>
        <div class="card-meta">${a.total_runs} runs &nbsp;·&nbsp; zadnji ${timeAgo(a.last_run)}</div>
      </div>
    `).join('');
  }

  const total=summary.reduce((s,a)=>s+parseFloat(a.total_amount||0),0);
  document.getElementById('total').textContent=fmt(total);

  const logEl=document.getElementById('log');
  if(!results.length){
    logEl.innerHTML='<div class="empty">Čekam prve rezultate…</div>';
  } else {
    logEl.innerHTML=results.map(r=>`
      <div class="log-row">
        <span class="lt">${new Date(r.created_at).toLocaleTimeString()}</span>
        <span class="la">${r.agent_name}</span>
        <span class="lc">${r.action}</span>
        <span class="lm">+${fmt(r.amount)}</span>
      </div>
    `).join('');
  }

  document.getElementById('updated').textContent='Osveženo: '+new Date().toLocaleTimeString();
}

refresh();
setInterval(refresh,30000);
</script>
</body>
</html>
